npm:
  publish: false
plugins:
  "@release-it/conventional-changelog":
    preset: angular
    infile: CHANGELOG.md
git:
  # npm run release:start runs release-it; release:finish tags once the release PR is merged into main.
  requireBranch: ["release/*", "hotfix/*"]
  requireUpstream: false
  tag: false
  commitMessage: "chore(version): increasing to ${version}"
hooks:
  after:bump:
    - "powershell -Command \"(Get-Content src/VepMod.cs -Encoding UTF8) -replace '\\[BepInPlugin\\(\\\"com\\.vep\\.vepMod\\\", \\\"VepMod\\\", \\\"[0-9]+\\.[0-9]+\\.[0-9]+\\\"\\)\\]', '[BepInPlugin(\\\"com.vep.vepMod\\\", \\\"VepMod\\\", \\\"${version}\\\")]' | Set-Content src/VepMod.cs -Encoding UTF8\""
    - "powershell -Command \"$json = Get-Content 'thunderstore/manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json; $json.version_number = '${version}'; $json | ConvertTo-Json -Depth 10 | Set-Content 'thunderstore/manifest.json' -Encoding UTF8\""
